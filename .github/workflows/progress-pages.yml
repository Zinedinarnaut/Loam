name: Progress site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/progress-pages.yml'
      - 'scripts/Build-Progress.ps1'
      - 'scripts/StatusMap.ps1'
      - 'crates/victory-shader/src/gfx10/opcodes.rs'
      - 'site/progress.json'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loam-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate progress
        shell: pwsh
        run: ./scripts/Build-Progress.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'loam-pages')
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/loam-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
